[project]
name = "rfdetr-paddy-crops"
version = "0.1.0"
description = "RFDetr model training for detection of rice crops in Jakarta-Bandung Mega-Urban Region (JBMUR), Indonesia"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gdown>=6.5.1",
    "ipywidgets>=8.1.9",
    "rasterio>=1.5.2",
    "rfdetr[loggers,train,visual]>=1.12.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
